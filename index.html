<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <title>Sing-box config editor</title>
  <style>
    /* Базовые стили контейнера (из фреймворка Material) */
    .admonition {
      box-shadow:
        0 0.2rem 0.5rem rgba(0, 0, 0, 0.05),
        0 0 0.05rem rgba(0, 0, 0, 0.1);
      border-left: 0.2rem solid;
      border-radius: 0.1rem;
      margin: 1.5625em 0;
      overflow: hidden;
    }

    .admonition-title {
      font-weight: 700;
      margin: 0;
      padding: 0.4rem 0.6rem 0.4rem 2.2rem;
      /* Оставляем место слева под иконку */
      position: relative;
    }

    .admonition-content {
      padding: 0.6rem;
    }

    .admonition-content p:last-child {
      margin-bottom: 0;
    }

    /* --- Точечные стили для !!! question на основе ваших данных --- */
    .admonition.question {
      border-left-color: rgb(100, 221, 23);
      background-color: rgb(255, 255, 255);
    }

    .admonition.question .admonition-title {
      background-color: rgba(100, 221, 23, 0.1);
      color: rgba(0, 0, 0, 0.87);
    }

    /* Точная копия оригинальной иконки "NEW" */
    .admonition.question .admonition-title::before {
      content: "";
      position: absolute;
      left: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1rem;
      height: 1rem;
      /* Задаем цвет иконки (автор красит её в цвет бордера) */
      background-color: rgb(100, 221, 23);
      /* Применяем скопированную маску */
      -webkit-mask-image: url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M20%204c1.11%200%202%20.89%202%202v12c0%201.11-.89%202-2%202H4c-1.11%200-2-.89-2-2V6c0-1.11.89-2%202-2zM8.5%2015V9H7.25v3.5L4.75%209H3.5v6h1.25v-3.5L7.3%2015zm5-4.74V9h-4v6h4v-1.25H11v-1.11h2.5v-1.26H11v-1.12zm7%203.74V9h-1.25v4.5h-1.12V10h-1.25v3.5h-1.13V9H14.5v5a1%201%200%200%200%201%201h4a1%201%200%200%200%201-1%22/%3E%3C/svg%3E");
      mask-image: url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M20%204c1.11%200%202%20.89%202%202v12c0%201.11-.89%202-2%202H4c-1.11%200-2-.89-2-2V6c0-1.11.89-2%202-2zM8.5%2015V9H7.25v3.5L4.75%209H3.5v6h1.25v-3.5L7.3%2015zm5-4.74V9h-4v6h4v-1.25H11v-1.11h2.5v-1.26H11v-1.12zm7%203.74V9h-1.25v4.5h-1.12V10h-1.25v3.5h-1.13V9H14.5v5a1%201%200%200%200%201%201h4a1%201%200%200%200%201-1%22/%3E%3C/svg%3E");
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    /* --- Точечные стили для !!! note --- */
    .admonition.note {
      border-left-color: rgb(68, 138, 255);
      background-color: rgb(255, 255, 255);
    }

    /* На случай, если у note появится заголовок */
    .admonition.note .admonition-title {
      background-color: rgba(68, 138, 255, 0.1);
      color: rgba(0, 0, 0, 0.87);
    }

    /* Убираем отступ под иконку, если её нет */
    .admonition.note .admonition-title::before {
      display: none;
    }

    .admonition.note .admonition-title {
      padding-left: 0.6rem;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: #f4f7f9;
      font-family: sans-serif;
    }

    .editor-wrapper {
      display: grid;
      grid-template-columns: fit-content(15%) 1fr 20%;
      height: 100vh;
    }

    .panel {
      height: 100vh;
      overflow-y: auto;
      background: white;
      border-right: 1px solid #dee2e6;
    }

    /* Меню слева */
    .menu-panel {
      background: #f8f9fa;
      padding: 10px;
    }

    .section-link {
      cursor: pointer;
      color: #333;
      display: flex;
      align-items: center;
      padding: 10px;
      margin-bottom: 5px;
      border-radius: 6px;
      transition: 0.2s;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .section-link:hover {
      background: #e9ecef;
    }

    .section-link.active {
      background: #0d6efd !important;
      color: white !important;
    }

    .section-checkbox {
      margin-right: 12px;
      transform: scale(1.2);
      cursor: pointer;
    }

    /* Форма по центру */
    .form-panel {
      padding: 10px;
      position: relative;
    }

    .config-layer {
      display: none;
    }

    /* Скрыто, пока не выберем в меню */
    /* 1. Резервируем место под скроллбар в центральной панели */
    .form-panel {
      padding: 10px;
      position: relative;
      /* Это заставит панель всегда держать место под полосу прокрутки */
      scrollbar-gutter: stable;
    }

    /* 2. Для старых браузеров (если gutter не сработает) 
      или если хочешь идеальной симметрии во всех колонках */
    .panel {
      scrollbar-gutter: stable;
    }

    /* Превью справа */
    .preview-panel {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border: none;
    }

    pre {
      font-size: 12px;
      margin: 0;
      color: #9cdcfe;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .preview-header {
      color: #888;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }

    /* Фикс для Jedison внутри Bootstrap 5 */
    .jedi-ready h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #0d6efd;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .well {
      background: #fff;
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    #copy-btn {
      border-color: #444;
      color: #888;
      transition: all 0.2s;
    }

    #copy-btn:hover {
      background: #333;
      color: #fff;
      border-color: #666;
    }

    #copy-btn.success {
      background: #198754;
      color: white;
      border-color: #198754;
    }

    /* Modal-info dialog restyling */
    .modal-header {
      display: none !important;
    }
  </style>
  <link rel="stylesheet" href="./assets/bootstrap/bootstrap.min.css" />
  <!-- <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    /> -->
  <link rel="stylesheet" href="./assets/bootstrap/bootstrap-icons.css" />
  <link rel="stylesheet" href="./assets/myTheme/icons/icons.css" />
  <script src="./assets/bootstrap/bootstrap.bundle.min.js"></script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/jedison@latest/dist/umd/jedison.umd.js"></script> -->
  <!-- <script src="./assets/jedison/jedison.umd.min.1.12.1_fix.js"></script> -->
  <!-- <script src="./assets/ajv/ajv2020.bundle.min.js"></script> -->
  <script src="./assets/marked/marked.min.js"></script>
  <script src="./assets/dompurify/purify.min.js"></script>
</head>

<body>
  <div class="editor-wrapper">
    <aside class="panel menu-panel">
      <h5 class="mb-4">Sing-box Editor</h5>
      <div id="main-menu"></div>
    </aside>

    <main class="panel form-panel">
      <div id="editor-layers"></div>
    </main>

    <aside class="panel preview-panel" style="position: relative">
      <div class="preview-header d-flex justify-content-between align-items-center">
        <span>FINAL CONFIG PREVIEW</span>
        <button id="copy-btn" class="btn btn-sm btn-outline-light" style="font-size: 10px; padding: 2px 8px">
          <i class="my-icon my-icon-copy"></i> COPY
        </button>
      </div>
      <pre id="json-preview"><code>{}</code></pre>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
